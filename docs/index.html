<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Idea Scraper — Reports</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #262a36;
    --text: #e6e8ef;
    --muted: #8b8fa3;
    --accent1: #14b8a6; /* teal */
    --accent2: #a855f7; /* purple */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }
  aside {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
  }
  aside h1 {
    font-size: 16px;
    margin: 0 0 4px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
  }
  aside p.sub { font-size: 12px; color: var(--muted); margin: 0 0 20px; }
  #dateList { list-style: none; padding: 0; margin: 0; }
  #dateList li {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  #dateList li:hover { background: #1f2330; color: var(--text); }
  #dateList li.active {
    background: linear-gradient(90deg, rgba(20,184,166,0.15), rgba(168,85,247,0.15));
    color: var(--text);
    border: 1px solid var(--accent1);
  }
  main { flex: 1; padding: 32px 40px; max-width: 820px; }
  main h2 { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
  #reportBody h1, #reportBody h2, #reportBody h3 { color: var(--text); }
  #reportBody h3 {
    border-left: 3px solid var(--accent1);
    padding-left: 10px;
  }
  #reportBody a { color: var(--accent1); }
  #reportBody code { background: #1f2330; padding: 2px 5px; border-radius: 4px; }
  #reportBody { line-height: 1.6; font-size: 15px; }
  .empty { color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>

<aside>
  <h1>Idea Scraper</h1>
  <p class="sub">Reddit + HN → Claude-ranked business ideas</p>
  <ul id="dateList"></ul>
</aside>

<main>
  <h2 id="activeDate">Loading…</h2>
  <div id="reportBody"></div>
</main>

<script>
async function loadManifest() {
  const res = await fetch('reports/manifest.json');
  if (!res.ok) {
    document.getElementById('reportBody').innerHTML =
      '<p class="empty">No reports yet. Run the scraper once to generate one.</p>';
    return;
  }
  const manifest = await res.json();
  const list = document.getElementById('dateList');
  list.innerHTML = '';
  manifest.forEach((entry, i) => {
    const li = document.createElement('li');
    li.textContent = entry.date;
    li.onclick = () => selectReport(entry, li);
    if (i === 0) selectReport(entry, li);
    list.appendChild(li);
  });
}

async function selectReport(entry, liEl) {
  document.querySelectorAll('#dateList li').forEach(li => li.classList.remove('active'));
  liEl.classList.add('active');
  document.getElementById('activeDate').textContent = 'Report — ' + entry.date;
  const res = await fetch('reports/' + entry.file);
  const md = await res.text();
  document.getElementById('reportBody').innerHTML = marked.parse(md);
}

loadManifest();
</script>

</body>
</html>
